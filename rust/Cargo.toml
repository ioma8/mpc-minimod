[workspace]
resolver = "3"
members = ["crates/dsp", "crates/minimod"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/jakubkolcar/sample-converter"

[workspace.dependencies]
minimod-dsp = { path = "crates/dsp" }
mpc-sample-sdk = { git = "https://github.com/ioma8/mpc-sample-sdk", tag = "v0.1.2" }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Every unsafe block and impl states its contract; the firmware boundary is the
# only place unsafe is allowed at all, so the comments are part of the review.
undocumented_unsafe_blocks = "deny"
# PCM conversion between the device's S32 frames and the f32 DSP samples is
# inherently lossy: the firmware hands us 32-bit integers and every buffer
# inside is f32.  Those conversions are confined to `dsp::sample`, whose
# functions are documented in terms of the exact rounding they perform.  Both
# lints are disabled for the whole workspace at once (never per line) because a
# sample-rate or buffer-length to float conversion is unavoidable in DSP code;
# every other cast is required to be exact and is checked by the lints above.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "none"

[profile.release.package."*"]
opt-level = 3
