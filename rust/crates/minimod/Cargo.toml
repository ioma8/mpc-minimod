[package]
name = "minimod"
description = "LD_PRELOAD firmware mod for the Akai MPC Sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["audio", "dsp", "reverse-engineering"]
categories = ["multimedia::audio"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["fw-1-4"]
fw-1-3 = ["mpc-sample-sdk/fw-1-3"]
fw-1-4 = ["mpc-sample-sdk/fw-1-4"]
dictation = []
dictation-rknn = []

[dependencies]
minimod-dsp.workspace = true
mpc-sample-sdk.workspace = true
libc.workspace = true

[lints]
workspace = true
